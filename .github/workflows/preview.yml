# A manual preview: uploads a version of the Worker WITHOUT deploying it (a preview URL), pointed at the dev
# database branch. Run it from the Actions tab when you want someone to see a branch. Never automatic.
name: preview

on:
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fontshare fonts cache
        uses: actions/cache@v6
        with:
          path: packages/ui/fonts/fontshare
          key: fontshare-${{ hashFiles('scripts/fonts-fetch.ts') }}
      - run: pnpm fonts:fetch
      - name: Storyset illustrations cache
        uses: actions/cache@v6
        with:
          path: |
            apps/web/public/illustrations
            apps/admin/public/illustrations
          key: storyset-${{ hashFiles('packages/ui/illustrations/storyset.json', 'scripts/illos-fetch.ts', 'packages/ui/src/tokens.ts') }}
      - run: pnpm illos:fetch
      - run: pnpm build:site
      - name: Upload a preview version (not deployed)
        run: pnpm --filter @eec/web exec wrangler versions upload --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
