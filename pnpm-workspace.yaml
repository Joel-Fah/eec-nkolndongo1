packages:
  - apps/*
  - packages/*
  - scripts

# One version per shared dependency, pinned exactly.
catalog:
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  vitest: 5.0.5
  vite: 8.3.4
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@hugeicons/core-free-icons": 4.3.5
  "@inlang/paraglide-js": 2.29.0

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.11"
  - "@better-auth/drizzle-adapter@1.7.11"
  - "@better-auth/kysely-adapter@1.7.11"
  - "@better-auth/memory-adapter@1.7.11"
  - "@better-auth/mongo-adapter@1.7.11"
  - "@better-auth/prisma-adapter@1.7.11"
  - "@better-auth/telemetry@1.7.11"
  - better-auth@1.7.11
